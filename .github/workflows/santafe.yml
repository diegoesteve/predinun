name: Santa Fe y región (a mano)

# Lo mismo que el paso «Santa Fe y región» del boletín (que corre cada 6 horas), para correrlo solo.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santafe
  cancel-in-progress: false

jobs:
  santafe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Santa Fe y región
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/santa_fe.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/santafe.json data/santafe_*.json data/historial_alarmas.csv
          git diff --cached --quiet && exit 0
          git commit -m "santa fe: $(TZ=America/Argentina/Cordoba date '+%d/%m %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
