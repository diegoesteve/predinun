name: Desplegar el receptor de aportes

# Despliega el Worker de Cloudflare que recibe el formulario "Aportá". Corre cuando cambia aportes/ o a mano.
on:
  push:
    branches: [main]
    paths: ['aportes/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que estén los secretos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Falta el secreto CLOUDFLARE_API_TOKEN: ver README, sección Aportes." ; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Crear el depósito R2 (si no existe) y desplegar
        working-directory: aportes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 r2 bucket create predinun-aportes || echo "El depósito ya existe"
          npx --yes wrangler@3 deploy
      - name: Cargar los secretos del Worker (solo los que estén definidos)
        working-directory: aportes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN_APORTES }}
          REVISION_USUARIO: ${{ secrets.REVISION_USUARIO }}
          REVISION_CLAVE: ${{ secrets.REVISION_CLAVE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for nombre in TURNSTILE_SECRET GH_TOKEN REVISION_USUARIO REVISION_CLAVE TELEGRAM_TOKEN TELEGRAM_CHAT_ID; do
            valor="${!nombre}"
            if [ -n "$valor" ]; then
              printf '%s' "$valor" | npx --yes wrangler@3 secret put "$nombre" >/dev/null && echo "$nombre cargado"
            else
              echo "$nombre sin definir (se saltea)"
            fi
          done
