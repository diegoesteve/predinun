name: Boletín de pronóstico

on:
  schedule:
    - cron: '20 */6 * * *'   # cada 6 h, cuando ya salieron las corridas nuevas de los modelos
  workflow_dispatch:
    inputs:
      cuencas:
        description: Recalcular la cuenca de cada arroyo (MERIT Hydro, tarda unos minutos)
        type: boolean
        default: false
      simulacion:
        description: Recalcular la simulación de crecida del Litoral (relieve + radar Sentinel-1, tarda unos minutos)
        type: boolean
        default: false
  push:                        # un aporte aprobado aparece en el mapa enseguida
    branches: [main]
    paths: ['data/aportes/**']

permissions:
  contents: write
  id-token: write   # para autenticarse en Google sin clave (Workload Identity Federation)

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  boletin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Autenticar en Google (sin clave)
        if: env.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Armar el boletín
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HISTORIAL_ARCHIVO: historial_alarmas_pronostico.csv
        run: python scripts/correr_boletin.py
      - name: Campings y balnearios junto al río (una vez por mes)
        continue-on-error: true
        env:
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
        run: python scripts/armar_campings.py
      - name: Actualizar el mapa de riesgo con lo que haya en data/
        run: python scripts/armar_riesgo.py
      - name: Cuenca de cada arroyo (solo si se pide o si falta)
        if: ${{ inputs.cuencas || hashFiles('data/cuencas_arroyos.geojson') == '' }}
        continue-on-error: true
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
        run: |
          pip install rasterio shapely
          python scripts/cuencas_arroyos.py 2>&1 | tee data/cuencas_arroyos.log
      - name: Simulación de crecida del Litoral (solo si se pide, si falta o el día 3 de cada mes)
        if: ${{ inputs.simulacion || hashFiles('docs/data/simulacion.json') == '' }}
        continue-on-error: true
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
        run: |
          pip install scipy pillow
          python scripts/simular_crecida.py 2>&1 | tee data/simulacion.log
      - name: Lluvia pronosticada y suelo por localidad
        continue-on-error: true
        run: python scripts/condiciones_localidades.py
      - name: Santa Fe y región (ríos del INA y lluvia por localidad)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/santa_fe.py
      - name: Hoy y mañana por localidad (la app)
        continue-on-error: true
        run: python scripts/armar_app.py
      - name: Páginas para compartir cada localidad (vista previa en WhatsApp)
        continue-on-error: true
        run: python scripts/paginas_compartir.py
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json docs/data/*.geojson data/*.json docs/l
          for f in data/cuencas_arroyos.geojson data/cuencas_arroyos.log data/historial_alarmas_pronostico.csv data/historial_alarmas.csv data/simulacion.log docs/data/simulacion; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet && exit 0
          git commit -m "boletín: $(TZ=America/Argentina/Cordoba date '+%d/%m %H:%M')"
          git pull --rebase -X theirs && git push
