name: Boletín de pronóstico

on:
  schedule:
    - cron: '20 */6 * * *'   # cada 6 h, cuando ya salieron las corridas nuevas de los modelos
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # para autenticarse en Google sin clave (Workload Identity Federation)

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  boletin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Autenticar en Google (sin clave)
        if: env.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Armar el boletín
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/correr_boletin.py
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/boletin.json data/*.json
          git diff --cached --quiet && exit 0
          git commit -m "boletín: $(TZ=America/Argentina/Cordoba date '+%d/%m %H:%M')"
          git pull --rebase -X theirs && git push
