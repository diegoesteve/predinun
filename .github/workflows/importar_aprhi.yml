name: Importar capas de la APRHI

on:
  schedule:
    - cron: '17 9 3 * *'   # una vez por mes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests shapely pandas
      - run: python scripts/importar_aprhi.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aprhi
          git diff --cached --quiet && exit 0
          git commit -m "APRHI: capas $(date '+%d/%m/%Y')"
          git pull --rebase -X theirs && git push
