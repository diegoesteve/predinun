name: Barrios (OpenStreetMap + GeoRef)

# Lista de barrios para buscar en la app. Una vez por mes o a mano.
on:
  schedule:
    - cron: '50 7 5 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  barrios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/barrios.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/barrios.json
          git diff --cached --quiet && exit 0
          git commit -m "barrios: $(date '+%d/%m/%Y')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
