name: Simulación de crecida (Litoral)

# Relieve + agua permanente + radar Sentinel-1 → hasta dónde llega el agua con cada altura del Paraná.
# El relieve no cambia: alcanza con correrlo una vez por mes (el radar ajusta la referencia con la última pasada).
on:
  schedule:
    - cron: '40 9 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: simulacion
  cancel-in-progress: false

jobs:
  simular:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt scipy pillow
      - name: Autenticar en Google (sin clave)
        if: env.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Simular
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
        run: python scripts/simular_crecida.py 2>&1 | tee data/simulacion.log
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/simulacion.log
          [ -f docs/data/simulacion.json ] && git add docs/data/simulacion.json
          [ -d docs/data/simulacion ] && git add docs/data/simulacion
          git diff --cached --quiet && exit 0
          git commit -m "simulación de crecida: $(TZ=America/Argentina/Cordoba date '+%d/%m %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
