# Worker que recibe los aportes del formulario de la página. Lo despliega .github/workflows/aportes.yml
name = "predinun-aportes"
main = "worker.js"
compatibility_date = "2024-09-23"

[vars]
ORIGEN = "https://diegoesteve.github.io"   # la página que puede enviar aportes
REPO = "diegoesteve/predinun"              # dónde se publican los aportes aprobados
RAMA = "main"

[[r2_buckets]]
binding = "APORTES"
bucket_name = "predinun-aportes"

# Despertador de los workflows de GitHub (ver scheduled() en worker.js)
[triggers]
crons = ["*/15 * * * *", "20 */6 * * *", "35 */6 * * *"]
